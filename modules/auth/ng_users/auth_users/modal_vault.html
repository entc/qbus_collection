<div class="modal-header">
  <div class="modal-title mr-auto">
    <strong><i class="fa fa-lock-open"></i>&nbsp;&nbsp;{{ 'AUTH.VAULT_SET' | transloco }}</strong>
  </div>
</div>
<div class="modal-body">

  <div class="input-group">
    <input type="password" class="form-control" [(ngModel)]="input_vsec">
  </div>

</div>
<div class="modal-footer">
  <div class="row w-100">
    <div class="col-lg-6 col-6 pr-1 pl-0 d-grid">
      <button type="button" class="btn btn-outline-secondary btn-block" (click)="modal.dismiss()">{{ 'MISC.CLOSE' | transloco }}</button>
    </div>
    <div class="col-lg-6 col-6 pl-1 pr-0 d-grid">
      <button type="button" class="btn btn-outline-success btn-block" (click)="apply()">{{ 'AUTH.VAULT_SET' | transloco }}</button>
    </div>
  </div>
</div>
